# Fast checks on every push to any branch (PRD R3, decision 5e).
# The pull-request preview job and the post-deploy run are added by T5.
name: theme-ci

on:
  push:

permissions:
  contents: read

concurrency:
  group: theme-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: theme check, eslint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHOPIFY_CLI_NO_ANALYTICS: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dev tooling
        run: npm ci --no-audit --no-fund

      - name: eslint
        run: npx eslint .

      - name: Install Shopify CLI
        # Pinned to the version verified locally; bump here and locally together.
        run: npm install -g @shopify/cli@4.8.0 --no-audit --no-fund

      - name: Theme check
        # Errors fail the build; warnings are tracked by T18 until the level is raised.
        run: shopify theme check --fail-level error

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Unit tests
        # Standard library only; the machine-local helper modules are stubbed by tests/script_stubs.py.
        run: python -m unittest discover -s tests -t . -v
